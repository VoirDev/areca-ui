name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      verify_run_id: ${{ steps.release.outputs.verify_run_id }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Finds the merged release PR, compares its tree with the pushed commit, and finds the
      # successful Verify run that holds its artifacts.
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release/detect

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Approval happens here: nothing is uploaded until a reviewer of the `release` environment
    # approves the run.
    environment: release
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download kept release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.detect.outputs.verify_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir release-artifacts

      - name: Publish kept artifacts unchanged
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./ci/release/publish-github-packages release-artifacts

  finalize:
    name: Create tag and GitHub Release
    needs:
      - detect
      - publish-github-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download kept release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.detect.outputs.verify_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir release-artifacts

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: ./ci/release/finalize release-artifacts
